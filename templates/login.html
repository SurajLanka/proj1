{% extends "base.html" %} {% block title %}Login - Instasnap{% endblock %} {%
block content %}
<div class="auth-container">
  <div class="card auth-card">
    <h2 class="section-title">🔐 Login</h2>
    <form method="POST" action="{{ url_for('login') }}">
      <label for="username">Username</label>
      <input
        type="text"
        id="username"
        name="username"
        placeholder="Enter your username"
        required
      />

      <label for="password">Password</label>
      <input
        type="password"
        id="password"
        name="password"
        placeholder="Enter your password"
        required
      />

      <button type="submit" class="btn btn-primary">Login</button>
    </form>

    <p class="muted">
      Don’t have an account?
      <a href="{{ url_for('signup') }}">Signup here</a>
    </p>
  </div>
</div>

<style>
  .auth-container {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 70vh;
  }
  .auth-card {
    max-width: 400px;
    width: 100%;
    text-align: center;
  }
  .auth-card form {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-top: 12px;
  }
  .auth-card label {
    text-align: left;
    font-size: 0.9rem;
    color: #bbb;
    margin-bottom: -6px;
  }
</style>
{% endblock %}
